add_newline = true
command_timeout = 200
format = "$username$hostname${custom.ip} $directory$git_branch$git_status$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[username]
show_always = true
format = "[$user](bold green)@"
disabled = false

[hostname]
ssh_only = false
format = "[$hostname](bold green)"
disabled = false

[custom.ip]
command = "ip route get 1 2>/dev/null | awk '{print \"(\" $7 \")\"; exit}'"
when = true
format = "[$output](bold #FFD700)"
disabled = false
